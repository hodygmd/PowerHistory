name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*') {
            $version = $ref.Substring(1)
          } else {
            $version = '0.0.0-dev'
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$ref" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained
        run: >
          dotnet publish src/PowerHistory.Cli/PowerHistory.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o ./publish

      - name: Create archive
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE ./publish/
          Remove-Item ./publish/*.pdb -ErrorAction SilentlyContinue

          $hash = (Get-FileHash ./publish/histo.exe -Algorithm SHA256).Hash
          "$hash  histo.exe" | Out-File -FilePath ./publish/SHA256SUMS.txt -Encoding ascii

          $zip = "histo-${{ steps.version.outputs.tag }}.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash

          $summary = @(
            "### $zip",
            "",
            "| Archivo | SHA-256 |",
            "| ------- | ------- |",
            "| histo.exe | $hash |",
            "| $zip | $zipHash |"
          ) -join "`n"

          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($text, $pattern)

          if ($match.Success) {
            $match.Value | Out-File -FilePath release-notes.md -Encoding utf8
          } else {
            "Release $version" | Out-File -FilePath release-notes.md -Encoding utf8
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: histo-${{ steps.version.outputs.tag }}.zip
          body_path: release-notes.md
