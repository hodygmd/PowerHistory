name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish self-contained
        run: >
          dotnet publish src/PowerHistory.Cli/PowerHistory.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish

      - name: Get version
        id: version
        run: echo "version=$(git describe --tags --always)" >> $env:GITHUB_OUTPUT

      - name: Create archive
        run: |
          Compress-Archive -Path ./publish/histo.exe -DestinationPath histo-${{ steps.version.outputs.version }}.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: histo-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
