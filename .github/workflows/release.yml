name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: >
          dotnet publish src/PowerHistory.Cli
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output artifacts

      - name: Checksum
        shell: pwsh
        run: >
          $hash = (Get-FileHash artifacts/histo.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256  histo.exe" | Out-File -Encoding ascii artifacts/histo.exe.sha256
          $hash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/histo.exe
            artifacts/histo.exe.sha256
          body: |
            Executable autónomo para Windows x64.

            Colocalo en una carpeta incluida en `PATH` y ejecutalo como `histo`.

            Verificá la integridad con el archivo `.sha256` adjunto.
          draft: false
          prerelease: false
